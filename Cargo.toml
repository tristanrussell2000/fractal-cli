[package]
name = "fractal"
version = "0.1.0"
edition = "2024"
description = "A CLI for exploring and editing SAP S/4HANA development systems"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
thiserror = "2"
keyring = "4"
rpassword = "7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "cookies"] }
url = "2.5.8"

[dev-dependencies]
keyring-core = "1"
wiremock = "0.6.5"
